name: CI

on:
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Format, lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: npm
      - run: npm ci
      - run: npm run validate
        env:
          # CI-only signing secret for `npm run build` (src/lib/env.ts requires
          # AUTH_SECRET to be set) — no `.env` file exists in CI, and this isn't
          # tied to any real account, so a literal value here is fine.
          AUTH_SECRET: "7f6d4563b7b3399589b74e6b8e50163c7c16e418994b11b60770d947a5ce4eab"
          NEXT_PUBLIC_APP_NAME: "Smarkets Clone"

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: npm
      - run: npm ci
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install Playwright OS dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - run: npm run test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
